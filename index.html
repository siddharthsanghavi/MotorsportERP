<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotorsportERP - FSAE Parts Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>MotorsportERP</h1>
        <p>FSAE car parts tracking web app</p>
      </header>

      <section class="card">
        <h2>Add Part</h2>
        <form id="part-form">
          <div class="grid">
            <label>
              Part Name
              <input id="name" name="name" type="text" required />
            </label>
            <label>
              Subsystem
              <select id="subsystem" name="subsystem" required>
                <option value="">Select subsystem</option>
                <option>Powertrain</option>
                <option>Suspension</option>
                <option>Brakes</option>
                <option>Electronics</option>
                <option>Chassis</option>
                <option>Aero</option>
                <option>Other</option>
              </select>
            </label>
            <label>
              Quantity
              <input id="quantity" name="quantity" type="number" min="1" value="1" required />
            </label>
            <label>
              Location
              <input id="location" name="location" type="text" placeholder="Car / Shop / Storage" required />
            </label>
            <label>
              Status
              <select id="status" name="status" required>
                <option>In Design</option>
                <option>Manufacturing</option>
                <option>In Inventory</option>
                <option>Installed</option>
                <option>Damaged</option>
              </select>
            </label>
          </div>
          <button type="submit">Add Part</button>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>Parts on Car / Inventory</h2>
          <input id="search" type="search" placeholder="Search by name, subsystem, location" />
        </div>
        <table>
          <thead>
            <tr>
              <th>Part</th>
              <th>Subsystem</th>
              <th>Qty</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="parts-body"></tbody>
        </table>
        <p id="empty-state" class="empty">No parts tracked yet.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
